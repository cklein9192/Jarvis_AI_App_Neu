name: J.A.R.V.I.S. Android APK bauen

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Quellcode herunterladen
        uses: actions/checkout@v4
      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Python vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Systempakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
      - name: Buildozer installieren
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: APK bauen
        run: buildozer android debug
      - name: APK als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V18.6.0-APK
          path: bin/*.apk
          if-no-files-found: error
